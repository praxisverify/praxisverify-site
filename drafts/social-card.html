<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,700;1,600&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body {
    background: #0A192F;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
}
.wm { position: absolute; opacity: 0.05; pointer-events: none; }
.wm-1 { top: -180px; left: -120px; width: 380px; }
.wm-2 { bottom: -200px; right: -100px; width: 420px; }
.logo { width: 300px; display: block; position: relative; z-index: 1; }
.tagline {
    font-family: 'EB Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 34px;
    color: #10B981;
    text-align: center;
    letter-spacing: 0.01em;
    position: relative;
    z-index: 1;
}
.cert {
    display: flex;
    align-items: center;
    gap: 22px;
    margin-top: 6px;
    position: relative;
    z-index: 1;
}
.cert-mark { line-height: 0; }
.cert-mark img { width: 88px; height: 132px; display: block; }
.cert-text { display: flex; flex-direction: column; gap: 10px; }
.cert-title {
    font-family: 'EB Garamond', Georgia, serif;
    font-weight: 700;
    font-size: 34px;
    color: #F4F6FA;
    letter-spacing: -0.01em;
}
.cert-sub {
    font-family: 'Inter', 'Helvetica Neue', sans-serif;
    font-weight: 500;
    font-size: 18px;
    color: #96A0B4;
    letter-spacing: 0.04em;
}
.domain {
    font-family: 'Inter', 'Helvetica Neue', sans-serif;
    font-weight: 500;
    font-size: 22px;
    color: #8892A6;
    letter-spacing: 0.08em;
    position: relative;
    z-index: 1;
}
</style>
</head>
<body>
<img class="wm wm-1" src="../img/brand/mark-white-transparent.svg" alt="">
<img class="wm wm-2" src="../img/brand/mark-white-transparent.svg" alt="">
<img class="logo" src="../img/brand/logo-stacked-white-transparent.svg" alt="PraxisVerify">
<p class="tagline">Verified Human Expertise for Life Sciences Compliance</p>
<div class="cert">
    <span class="cert-mark"><img src="../img/cert/nqa-iso-13485.jpg" alt="NQA ISO 13485 Medical Devices certification mark"></span>
    <div class="cert-text">
        <p class="cert-title">ISO 13485:2016 certified</p>
        <p class="cert-sub">NQA &middot; certificate 228075</p>
        <p class="domain">praxisverify.com</p>
    </div>
</div>
</body>
</html>
